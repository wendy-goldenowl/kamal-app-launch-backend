service: backend
image: your-registry.com/backend
registry:
  username:
  password:
  server: your-registry.com

servers:
  web:
    hosts:
      - user@<%= ENV['HOST_IP'] %>
    labels:
      deploy: yes

env:
  clear:
    PORT: 8080
    DB_HOST: your-db-host
    DB_PORT: 5432
    DB_NAME: your-db-name
    DB_USER: your-db-user
    DB_PASSWORD: your-db-password

healthcheck:
  path: /health
  port: 8080
  max_attempts: 10
  interval: 2