deploy_application:
  stage: deploy
  image: ruby:3.2
  before_script:
    - set -x
    - gem install kamal
    - mkdir -p ~/.ssh
    - printf "%s" "$SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_rsa
    - cp config/deploy-stag.yml config/deploy.yml
    - ls -la config/
    - env
    - |
      sed -i \
        -e "s|BACKEND_IMAGE|$BACKEND_IMAGE|g" \
        -e "s|CI_COMMIT_SHA|latest|g" \
        -e "s|CI_REGISTRY|$CI_REGISTRY|g" \
        -e "s|CI_REGISTRY_USER|$CI_REGISTRY_USER|g" \
        -e "s|CI_REGISTRY_PASSWORD|$CI_REGISTRY_PASSWORD|g" \
        -e "s|DOMAIN_NAME|$DOMAIN_NAME|g" \
        -e "s|SSH_USER|$SSH_USER|g" \
        -e "s|DB_NAME|$DB_NAME|g" \
        -e "s|DB_USER|$DB_USER|g" \
        -e "s|DB_PASS|$DB_PASS|g" \
        -e "s|DB_HOST|$DB_HOST|g" \
        config/deploy.yml
  script:
    - KAMAL_DEBUG=1 kamal setup
    - kamal deploy
  environment:
    name: staging
  only:
    - develop