variables:
  BACKEND_IMAGE: $CI_REGISTRY/$USER_REGISTRY/$CI_PROJECT_NAME
  KAMAL_CONFIG_PATH: config/deploy.yml

build:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    # Build and push backend
    - docker build -t $BACKEND_IMAGE:$CI_COMMIT_SHA -t $BACKEND_IMAGE:latest .
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHA
    - docker push $BACKEND_IMAGE:latest
  only:
    - develop

deploy_application:
  stage: deploy
  image: ruby:3.2
  variables:
    DOMAIN_NAME: ${DOMAIN_NAME}
  before_script:
    - gem install kamal
    - mkdir -p ~/.ssh
    - printf "%s" "$SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_rsa
    - echo "Deploying to $DOMAIN_NAME"
  script:
    - KAMAL_DEBUG=1 kamal setup
    - kamal deploy
  environment:
    name: staging
  only:
    - develop